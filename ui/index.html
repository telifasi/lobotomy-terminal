<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>脑叶公司终端</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0f0c;
      color: #d8e0d8;
      font-family: "Cascadia Mono", "Consolas", monospace;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      padding: 8px 10px;
      border-left: 2px solid #3f5a3a;
      background: rgba(255, 255, 255, 0.04);
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { border-left-color: #f5c211; color: #f5c211; }
    .msg.ai { border-left-color: #5fd0e6; }
    .msg.error { border-left-color: #ff5555; color: #ff8888; }
    .msg.system { border-left-color: #666; color: #888; }
    .composer {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid rgba(245, 194, 17, 0.3);
      background: #10150f;
    }
    #input {
      flex: 1;
      min-height: 52px;
      max-height: 120px;
      resize: vertical;
      padding: 8px;
      background: #0b0f0c;
      border: 1px solid rgba(245, 194, 17, 0.35);
      color: #d8e0d8;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    #input:focus { border-color: #f5c211; }
    #send {
      width: 72px;
      background: #f5c211;
      border: 0;
      color: #0b0f0c;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    #send:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="app">
    <div id="messages">
      <div class="msg system">脑叶公司终端 // 最小闭环测试。输入内容后发送，会调用当前酒馆角色生成回复。</div>
    </div>
    <div class="composer">
      <textarea id="input" placeholder="输入指令，例如：让 Angela 汇报刚才的工作结果。"></textarea>
      <button id="send">发送</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages')
    const input = document.getElementById('input')
    const sendButton = document.getElementById('send')

    function addMessage(role, text) {
      const div = document.createElement('div')
      div.className = 'msg ' + role
      div.textContent = text
      messages.appendChild(div)
      messages.scrollTop = messages.scrollHeight
      return div
    }

    async function send() {
      const text = input.value.trim()
      if (!text) return

      addMessage('user', text)
      input.value = ''
      sendButton.disabled = true
      const pending = addMessage('system', '生成中…')

      try {
        const parentWindow = window.parent || window.top
        const context = parentWindow.SillyTavern.getContext()
        const result = await context.generateQuietPrompt({
          quietPrompt: text,
          quietToLoud: false,
          removeReasoning: true,
        })
        pending.remove()
        addMessage('ai', result || '（空回复）')
      } catch (error) {
        pending.remove()
        addMessage('error', '错误：' + (error && error.message ? error.message : String(error)))
      } finally {
        sendButton.disabled = false
        input.focus()
      }
    }

    sendButton.addEventListener('click', send)
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault()
        send()
      }
    })
  </script>
</body>
</html>
